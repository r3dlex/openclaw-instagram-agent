name: Set up Python (uv-managed)
description: >-
  Install a uv-managed CPython and put it first on PATH for the rest of the job.
  actions/setup-python cannot run on macOS self-hosted runners: it hardcodes
  /Users/runner/hostedtoolcache and then `sudo installer`s the framework into
  /Library/Frameworks, neither of which a job can satisfy without root. uv's
  managed CPython is relocatable and user-writable, so it needs neither.

inputs:
  python-version:
    description: CPython version to install.
    required: false
    default: "3.11"

outputs:
  python_key:
    description: >-
      Short digest of the managed interpreter's absolute path. Use it in a cache
      key: that path embeds the runner's work root, the repository name and
      the CPython version, so the digest changes exactly when a cached
      virtualenv would have gone stale.
    value: ${{ steps.install.outputs.python_key }}

runs:
  using: composite
  steps:
    - id: install
      name: Install and verify the uv-managed interpreter
      shell: bash
      env:
        PYTHON_VERSION: ${{ inputs.python-version }}
      run: |
        set -euo pipefail
        # Per-runner-workspace install directory: two runners on one host share
        # $HOME, so a shared interpreter would let concurrent jobs overwrite
        # each other. A runner runs one job at a time, so the workspace is
        # safe; it is not, however, per-job.
        export UV_PYTHON_INSTALL_DIR="${UV_PYTHON_INSTALL_DIR:-$GITHUB_WORKSPACE/.uv-python}"
        command -v uv >/dev/null || { echo "::error::uv is not on PATH"; exit 1; }
        # --no-bin: without it uv also drops a python3.11 shim into ~/.local/bin,
        # which is the runners' SHARED $HOME and therefore a cross-job race.
        uv python install --no-bin "$PYTHON_VERSION"
        PY="$(uv python find --managed-python "$PYTHON_VERSION")"
        test -x "$PY" || { echo "::error::interpreter is not executable: $PY"; exit 1; }
        "$PY" -c 'import sys, ssl, sysconfig; print(sys.version); print(sysconfig.get_platform())'
        # GITHUB_PATH prepends, so a later bare `python3` resolves here and not
        # to /opt/homebrew/bin/python3 or /usr/bin/python3. Assert it now: the
        # managed bin directory has to carry a `python3`, and the prepended
        # directory has to win over whatever the runner's PATH already had.
        export PATH="$(dirname "$PY"):$PATH"
        RESOLVED="$(command -v python3 || true)"
        case "$RESOLVED" in
          "$(dirname "$PY")"/*) echo "python3 resolves to $RESOLVED" ;;
          *) echo "::error::python3 resolves to '${RESOLVED:-<not found>}', expected the managed interpreter in $(dirname "$PY")"; exit 1 ;;
        esac
        echo "$(dirname "$PY")" >> "$GITHUB_PATH"
        echo "PYTHON=$PY" >> "$GITHUB_ENV"
        echo "UV_PYTHON_INSTALL_DIR=$UV_PYTHON_INSTALL_DIR" >> "$GITHUB_ENV"
        # Cache-key discriminator. The interpreter's absolute path is
        # <workspace>/.uv-python/cpython-<version>-<os>-<arch>/bin/python3.x,
        # so it embeds the runner's work root, the repository name and the
        # CPython version. Hashing it keeps the cache key short while still
        # changing whenever a restored virtualenv would be stale.
        echo "python_key=$("$PY" -c 'import hashlib,sys; print(hashlib.sha256(sys.argv[1].encode()).hexdigest()[:16])' "$PY")" >> "$GITHUB_OUTPUT"
