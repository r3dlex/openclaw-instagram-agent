name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The workflow only checks out code and runs it; it never needs to write to
# the repository or to use the API with write scope.
permissions:
  contents: read

jobs:
  # ==========================================================================
  # ci (Full CI Pipeline)
  # ==========================================================================
  _ci-self-hosted:
    name: "Full CI Pipeline (self-hosted)"
    runs-on: [self-hosted, mac-arm64]
    continue-on-error: true
    env:
      # runner-1 and runner-2 are two runner instances on ONE host that share a
      # single $HOME, and these jobs can overlap. Point every shared install
      # location at a per-job directory so concurrent jobs cannot clobber each
      # other's Poetry install, config, virtualenv or interpreter.
      POETRY_HOME: ${{ github.workspace }}/.poetry
      # Poetry's config.toml lives in the OS config dir
      # (~/Library/Application Support/pypoetry), NOT under POETRY_HOME, and
      # snok/install-poetry rewrites it on every job.
      POETRY_CONFIG_DIR: ${{ github.workspace }}/.poetry-config
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.uv-python
    outputs:
      passed: ${{ steps.mark.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
      # actions/setup-python cannot run on macOS self-hosted runners: it hardcodes
      # /Users/runner/hostedtoolcache and then `sudo installer`s into /Library/Frameworks.
      # uv's managed CPython is relocatable and user-writable: no sudo, no /Users/runner.
      - name: Set up Python
        uses: ./.github/actions/setup-uv-python
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "1.8.5"
          # Poetry's default is {cache-dir}/virtualenvs and cache-dir is the
          # shared ~/Library/Caches/pypoetry - not per-job. Point the venv at
          # the per-job workspace so it can never land in a shared path.
          virtualenvs-path: ${{ github.workspace }}/.venv
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          # runner.os is macOS for BOTH r3dlex-runner-1 and r3dlex-runner-2, so
          # it alone would let one runner restore the other's venv - whose
          # console-script shebangs and pyvenv.cfg point at that runner's
          # absolute workspace and interpreter paths. runner.name separates them.
          key: venv-${{ runner.os }}-${{ runner.name }}-${{ hashFiles('poetry.lock') }}
      - name: Install dependencies
        run: poetry install --with dev
      - name: Create dummy .env for CI
        run: cp .env.example .env
      - name: Run CI pipeline
        run: poetry run pipeline ci --json
      - id: mark
        if: success()
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

  ci:
    name: Full CI Pipeline
    needs: _ci-self-hosted
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Route
        run: echo "self-hosted passed=${{ needs._ci-self-hosted.outputs.passed }}"
      - uses: actions/checkout@v4
        if: needs._ci-self-hosted.outputs.passed != 'true'
      - name: Set up Python
        if: needs._ci-self-hosted.outputs.passed != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        if: needs._ci-self-hosted.outputs.passed != 'true'
        uses: snok/install-poetry@v1
        with:
          version: "1.8.5"
          virtualenvs-in-project: true
      - name: Cache dependencies
        if: needs._ci-self-hosted.outputs.passed != 'true'
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - name: Install dependencies
        if: needs._ci-self-hosted.outputs.passed != 'true'
        run: poetry install --with dev
      - name: Create dummy .env for CI
        if: needs._ci-self-hosted.outputs.passed != 'true'
        run: cp .env.example .env
      - name: Run CI pipeline
        if: needs._ci-self-hosted.outputs.passed != 'true'
        run: poetry run pipeline ci --json

  # ==========================================================================
  # security (Security Pipeline)
  # ==========================================================================
  _security-self-hosted:
