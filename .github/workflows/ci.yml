name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ==========================================================================
  # ci (Full CI Pipeline)
  # ==========================================================================
  _ci-self-hosted:
    name: "Full CI Pipeline (self-hosted)"
    runs-on: [self-hosted, mac-arm64]
    continue-on-error: true
    env:
      # runner-1 and runner-2 are two runner instances on ONE host that share a
      # single $HOME, and these jobs can overlap. Point every shared install
      # location at a per-job directory so concurrent jobs cannot clobber each
      # other's Poetry install, config, virtualenv or interpreter.
      POETRY_HOME: ${{ github.workspace }}/.poetry
      # Poetry's config.toml lives in the OS config dir
      # (~/Library/Application Support/pypoetry), NOT under POETRY_HOME, and
      # snok/install-poetry rewrites it on every job.
      POETRY_CONFIG_DIR: ${{ github.workspace }}/.poetry-config
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.uv-python
    outputs:
      passed: ${{ steps.mark.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
      # actions/setup-python cannot run on macOS self-hosted runners: it hardcodes
      # /Users/runner/hostedtoolcache and then `sudo installer`s into /Library/Frameworks.
      # uv's managed CPython is relocatable and user-writable: no sudo, no /Users/runner.
      - name: Set up Python
        uses: ./.github/actions/setup-uv-python
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "1.8.5"
          # Poetry's default is {cache-dir}/virtualenvs and cache-dir is the
          # shared ~/Library/Caches/pypoetry - not per-job. Point the venv at
          # the per-job workspace so it can never land in a shared path.
          virtualenvs-path: ${{ github.workspace }}/.virtualenvs
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - name: Install dependencies
        run: poetry install --with dev
      - name: Create dummy .env for CI
        run: cp .env.example .env
      - name: Run CI pipeline
        run: poetry run pipeline ci --json
      - id: mark
        if: success()
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

  ci:
    name: Full CI Pipeline
    needs: _ci-self-hosted
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Route
        run: echo "self-hosted passed=${{ needs._ci-self-hosted.outputs.passed }}"
      - uses: actions/checkout@v4
        if: needs._ci-self-hosted.outputs.passed != 'true'
      - name: Set up Python
        if: needs._ci-self-hosted.outputs.passed != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        if: needs._ci-self-hosted.outputs.passed != 'true'
        uses: snok/install-poetry@v1
        with:
          version: "1.8.5"
          virtualenvs-in-project: true
      - name: Cache dependencies
        if: needs._ci-self-hosted.outputs.passed != 'true'
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - name: Install dependencies
        if: needs._ci-self-hosted.outputs.passed != 'true'
        run: poetry install --with dev
      - name: Create dummy .env for CI
        if: needs._ci-self-hosted.outputs.passed != 'true'
        run: cp .env.example .env
      - name: Run CI pipeline
        if: needs._ci-self-hosted.outputs.passed != 'true'
        run: poetry run pipeline ci --json

  # ==========================================================================
  # security (Security Pipeline)
  # ==========================================================================
  _security-self-hosted:
    name: "Security Pipeline (self-hosted)"
    runs-on: [self-hosted, mac-arm64]
    continue-on-error: true
    env:
      # runner-1 and runner-2 are two runner instances on ONE host that share a
      # single $HOME, and these jobs can overlap. Point every shared install
      # location at a per-job directory so concurrent jobs cannot clobber each
      # other's Poetry install, config, virtualenv or interpreter.
      POETRY_HOME: ${{ github.workspace }}/.poetry
      # Poetry's config.toml lives in the OS config dir
      # (~/Library/Application Support/pypoetry), NOT under POETRY_HOME, and
      # snok/install-poetry rewrites it on every job.
      POETRY_CONFIG_DIR: ${{ github.workspace }}/.poetry-config
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.uv-python
    outputs:
      passed: ${{ steps.mark.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
      # actions/setup-python cannot run on macOS self-hosted runners: it hardcodes
      # /Users/runner/hostedtoolcache and then `sudo installer`s into /Library/Frameworks.
      # uv's managed CPython is relocatable and user-writable: no sudo, no /Users/runner.
      - name: Set up Python
        uses: ./.github/actions/setup-uv-python
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "1.8.5"
          # Poetry's default is {cache-dir}/virtualenvs and cache-dir is the
          # shared ~/Library/Caches/pypoetry - not per-job. Point the venv at
          # the per-job workspace so it can never land in a shared path.
          virtualenvs-path: ${{ github.workspace }}/.virtualenvs
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - name: Install dependencies
        run: poetry install --with dev
      - name: Create dummy .env for CI
        run: cp .env.example .env
      - name: Run security pipeline
        run: poetry run pipeline security --json
      - id: mark
        if: success()
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

  security:
    name: Security Pipeline
    needs: _security-self-hosted
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Route
        run: echo "self-hosted passed=${{ needs._security-self-hosted.outputs.passed }}"
      - uses: actions/checkout@v4
        if: needs._security-self-hosted.outputs.passed != 'true'
      - name: Set up Python
        if: needs._security-self-hosted.outputs.passed != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        if: needs._security-self-hosted.outputs.passed != 'true'
        uses: snok/install-poetry@v1
        with:
          version: "1.8.5"
          virtualenvs-in-project: true
      - name: Cache dependencies
        if: needs._security-self-hosted.outputs.passed != 'true'
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - name: Install dependencies
        if: needs._security-self-hosted.outputs.passed != 'true'
        run: poetry install --with dev
      - name: Create dummy .env for CI
        if: needs._security-self-hosted.outputs.passed != 'true'
        run: cp .env.example .env
      - name: Run security pipeline
        if: needs._security-self-hosted.outputs.passed != 'true'
        run: poetry run pipeline security --json

  # ==========================================================================
  # docs (Docs Pipeline)
  # ==========================================================================
  _docs-self-hosted:
    name: "Docs Pipeline (self-hosted)"
    runs-on: [self-hosted, mac-arm64]
    continue-on-error: true
    env:
      # runner-1 and runner-2 are two runner instances on ONE host that share a
      # single $HOME, and these jobs can overlap. Point every shared install
      # location at a per-job directory so concurrent jobs cannot clobber each
      # other's Poetry install, config, virtualenv or interpreter.
      POETRY_HOME: ${{ github.workspace }}/.poetry
      # Poetry's config.toml lives in the OS config dir
      # (~/Library/Application Support/pypoetry), NOT under POETRY_HOME, and
      # snok/install-poetry rewrites it on every job.
      POETRY_CONFIG_DIR: ${{ github.workspace }}/.poetry-config
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.uv-python
    outputs:
      passed: ${{ steps.mark.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
      # actions/setup-python cannot run on macOS self-hosted runners: it hardcodes
      # /Users/runner/hostedtoolcache and then `sudo installer`s into /Library/Frameworks.
      # uv's managed CPython is relocatable and user-writable: no sudo, no /Users/runner.
      - name: Set up Python
        uses: ./.github/actions/setup-uv-python
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "1.8.5"
          # Poetry's default is {cache-dir}/virtualenvs and cache-dir is the
          # shared ~/Library/Caches/pypoetry - not per-job. Point the venv at
          # the per-job workspace so it can never land in a shared path.
          virtualenvs-path: ${{ github.workspace }}/.virtualenvs
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - name: Install dependencies
        run: poetry install --with dev
      - name: Create dummy .env for CI
        run: cp .env.example .env
      - name: Run docs pipeline
        run: poetry run pipeline docs --json
      - id: mark
        if: success()
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

  docs:
    name: Docs Pipeline
    needs: _docs-self-hosted
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Route
        run: echo "self-hosted passed=${{ needs._docs-self-hosted.outputs.passed }}"
      - uses: actions/checkout@v4
        if: needs._docs-self-hosted.outputs.passed != 'true'
      - name: Set up Python
        if: needs._docs-self-hosted.outputs.passed != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        if: needs._docs-self-hosted.outputs.passed != 'true'
        uses: snok/install-poetry@v1
        with:
          version: "1.8.5"
          virtualenvs-in-project: true
      - name: Cache dependencies
        if: needs._docs-self-hosted.outputs.passed != 'true'
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - name: Install dependencies
        if: needs._docs-self-hosted.outputs.passed != 'true'
        run: poetry install --with dev
      - name: Create dummy .env for CI
        if: needs._docs-self-hosted.outputs.passed != 'true'
        run: cp .env.example .env
      - name: Run docs pipeline
        if: needs._docs-self-hosted.outputs.passed != 'true'
        run: poetry run pipeline docs --json

  # ==========================================================================
  # Probe: which setup-* actions are usable on these macOS runners?
  # node-version 24 is not in the runner tool cache, so setup-node performs a
  # real download + tool-cache install instead of a cache hit.
  # ==========================================================================
  _probe-setup-actions:
    name: "Probe: setup-python vs setup-node (self-hosted)"
    runs-on: [self-hosted, mac-arm64]
    continue-on-error: true
    env:
      POETRY_HOME: ${{ github.workspace }}/.poetry
      POETRY_CONFIG_DIR: ${{ github.workspace }}/.poetry-config
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.uv-python
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: ./.github/actions/setup-uv-python
      - name: Record PATH ordering
        run: |
          echo "PATH=$PATH"
          echo "uv=$(command -v uv)"
          echo "which -a python3:"
          which -a python3
          echo "python3=$(python3 --version 2>&1)"
          echo "python3 path=$(command -v python3)"
          echo "PYTHON=$PYTHON"
          "$PYTHON" --version
      - name: Record tool cache
        run: echo "RUNNER_TOOL_CACHE=$RUNNER_TOOL_CACHE" && ls "$RUNNER_TOOL_CACHE"
      - name: setup-python (expected to fail on macOS)
        id: setup_python
        continue-on-error: true
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: setup-python outcome
        run: echo "setup-python outcome=${{ steps.setup_python.outcome }}"
      - name: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify node
        run: node --version && npm --version && which node
